<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Isotara system map</title>
  <desc id="description">A portfolio sketch showing card recipes moving through reusable effects, encounters, and run progression.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071c25"/>
      <stop offset="1" stop-color="#102f31"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8ee6c2" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="420" rx="18" fill="url(#backdrop)"/>
  <rect width="960" height="420" rx="18" fill="url(#grid)"/>
  <path d="M50 84H910" stroke="#8ee6c2" stroke-opacity=".24"/>
