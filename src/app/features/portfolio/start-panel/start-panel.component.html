<section class="start-panel" aria-labelledby="start-panel-heading">
  <div class="start-panel__hero">
    <div class="start-panel__copy">
      <p class="eyebrow">{{ copy.eyebrow }}</p>
      <h2 id="start-panel-heading">{{ copy.title }}</h2>

      @for (paragraph of copy.paragraphs; track paragraph) {
        <p class="start-panel__intro">{{ paragraph }}</p>
      }

      <div class="start-panel__actions" aria-label="Portfolio shortcuts">
        <button class="retro-button retro-button--primary" type="button" (click)="open('impact')">
          View my work
        </button>
        <button class="retro-button" type="button" (click)="open('builds')">Side projects</button>
        <button class="retro-button" type="button" (click)="open('resume')">Open résumé</button>
      </div>
    </div>

    <aside class="start-panel__identity" aria-label="Connor Patterson profile">
      <div class="start-panel__portrait-frame">
        <img
          [src]="portrait.src"
          [alt]="portrait.alt"
          [width]="portrait.width"
          [height]="portrait.height"
        />
        <span class="start-panel__online"
          ><i class="status-dot" aria-hidden="true"></i> ONLINE</span
        >
      </div>
      <strong>CONNOR PATTERSON</strong>
      <span>FULL STACK SOFTWARE ENGINEER</span>
    </aside>
  </div>

  <div class="start-panel__metrics" aria-label="Career highlights">
    @for (metric of metrics; track metric.label) {
      <article class="start-panel__metric">
        <strong>{{ metric.value }}</strong>
        <span>{{ metric.label }}</span>
        <p>{{ metric.detail }}</p>
      </article>
    }
  </div>

  <footer class="start-panel__footer">
    <p><span class="status-dot" aria-hidden="true"></span> {{ copy.status }}</p>
  </footer>
</section>
